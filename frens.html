<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Frens - Affecto Coin</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .frens-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            margin: 5px 0 10px;
            scrollbar-width: thin;
            scrollbar-color: #FFD700 #1a1f2e;
            max-height: calc(90vh - 120px);
        }
        
        .frens-container::-webkit-scrollbar {
            width: 5px;
        }
        
        .frens-container::-webkit-scrollbar-track {
            background: #1a1f2e;
            border-radius: 10px;
        }
        
        .frens-container::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }
        
        .frens-header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            margin: 15px 15px 5px;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .balance-display {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            background: rgba(0,0,0,0.4);
            padding: 6px 15px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .balance-display img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px gold);
        }
        
        .balance-display span {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFD700;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:active {
            background: rgba(255,215,0,0.15);
        }
        
        .back-btn::before {
            content: "←";
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .stats-card {
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            margin: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            text-align: center;
        }
        
        .stats-title {
            font-size: 1rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .stats-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 20px gold;
            margin-bottom: 5px;
        }
        
        .stats-label {
            font-size: 0.9rem;
            color: #fff;
        }
        
        .stats-label span {
            color: #FFD700;
            font-weight: 700;
        }
        
        .invite-btn {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            border: none;
            border-radius: 40px;
            padding: 18px;
            margin: 15px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #000;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255,215,0,0.3);
            border: 2px solid white;
        }
        
        .invite-btn:active {
            transform: scale(0.97);
        }
        
        .invite-btn img {
            width: 30px;
            height: 30px;
            margin-right: 10px;
            vertical-align: middle;
            filter: brightness(0);
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            margin: 20px 15px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .frens-list {
            margin: 0 15px 20px;
        }
        
        .fren-item {
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .fren-avatar {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: linear-gradient(145deg, #2d3b4f, #1a2535);
            border: 2px solid #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #FFD700;
        }
        
        .fren-info {
            flex: 1;
        }
        
        .fren-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }
        
        .fren-earned {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1rem;
            font-weight: 600;
            color: #FFD700;
        }
        
        .fren-earned img {
            width: 18px;
            height: 18px;
        }
        
        .fren-rank {
            font-size: 1.5rem;
            font-weight: 900;
            min-width: 40px;
            text-align: center;
        }
        
        .rank-1 { color: #FFD700; text-shadow: 0 0 10px gold; }
        .rank-2 { color: #C0C0C0; }
        .rank-3 { color: #CD7F32; }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
        
        .empty-state img {
            width: 80px;
            height: 80px;
            opacity: 0.3;
            margin-bottom: 15px;
        }
        
        .referral-link {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 12px;
            margin: 15px;
            font-size: 0.8rem;
            color: #aaa;
            word-break: break-all;
            border: 1px dashed #FFD700;
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="frens-header">
            <div class="back-btn" onclick="window.location.href='index.html'">Назад</div>
            <div class="balance-display">
                <img src="img/coin.png" alt="coin">
                <span id="balance">0</span>
            </div>
        </div>
        
        <div class="frens-container">
            <div class="stats-card">
                <div class="stats-title">👥 Мои друзья</div>
                <div class="stats-value" id="totalFrens">0</div>
                <div class="stats-label">1 друг = <span>+50,000</span> монет</div>
            </div>
            
            <div class="invite-btn" id="inviteBtn">
                <img src="img/frens.png" alt="invite">
                ПРИГЛАСИТЬ ДРУЗЕЙ
            </div>
            
            <div class="referral-link" id="referralLink"></div>
            
            <div class="section-title">
                <span>🏆</span> МОИ ДРУЗЬЯ
            </div>
            
            <div class="frens-list" id="frensList">
                <div class="empty-state">
                    <img src="img/frens.png" alt="no frens">
                    <div style="color: #666;">У вас пока нет друзей</div>
                    <div style="color: #888; font-size: 0.9rem; margin-top: 10px;">
                        Пригласите друзей и получите бонус 50,000 монет!
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="frens.js"></script>
</body>
</html>
