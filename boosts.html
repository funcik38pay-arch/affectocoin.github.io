<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Boosts - Affecto Clicker</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .boosts-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            margin: 5px 0 10px;
            scrollbar-width: thin;
            scrollbar-color: #FFD700 #1a1f2e;
            max-height: calc(90vh - 120px);
        }
        .boosts-container::-webkit-scrollbar { width: 5px; }
        .boosts-container::-webkit-scrollbar-track { background: #1a1f2e; border-radius: 10px; }
        .boosts-container::-webkit-scrollbar-thumb { background: #FFD700; border-radius: 10px; }
        .boost-section {
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #FFD700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .boost-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .boost-info { flex: 1; }
        .boost-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .boost-name span {
            color: #FFD700;
            font-size: 0.85rem;
            background: rgba(255,215,0,0.15);
            padding: 4px 12px;
            border-radius: 30px;
        }
        .boost-desc { font-size: 0.9rem; color: #aaa; margin-bottom: 5px; }
        .boost-effect {
            font-size: 1.1rem;
            font-weight: 600;
            color: #FFD700;
        }
        .boost-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .boost-price {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            border-radius: 30px;
            min-width: 80px;
            justify-content: center;
        }
        .boost-price img { width: 20px; height: 20px; }
        .buy-btn {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            border: none;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: 0.1s;
            min-width: 85px;
            text-align: center;
        }
        .buy-btn:active { transform: scale(0.95); }
        .buy-btn.disabled {
            background: linear-gradient(145deg, #555, #333);
            color: #888;
            pointer-events: none;
        }
        .buy-btn.locked {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            color: #666;
            pointer-events: none;
            position: relative;
            padding-left: 35px;
        }
        .buy-btn.locked::before {
            content: "🔒";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        .free-boosters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }
        .free-boost-item {
            background: rgba(25, 30, 40, 0.9);
            border-radius: 22px;
            padding: 18px 15px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.25);
        }
        .free-boost-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 12px;
        }
        .free-boost-count {
            font-size: 2.5rem;
            font-weight: 900;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 0 15px gold;
        }
        .free-boost-timer {
            font-size: 1rem;
            color: #aaa;
            background: rgba(0,0,0,0.4);
            padding: 8px 5px;
            border-radius: 30px;
            font-family: monospace;
            margin-bottom: 8px;
        }
        .use-btn {
            background: rgba(255,215,0,0.15);
            border: 2px solid #FFD700;
            border-radius: 30px;
            padding: 10px;
            font-size: 1rem;
            font-weight: 700;
            color: #FFD700;
            cursor: pointer;
            transition: 0.1s;
            margin-top: 8px;
            width: 100%;
        }
        .use-btn:active {
            background: #FFD700;
            color: black;
        }
        .header-boosts {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            margin: 15px 15px 5px;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .balance-display {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            background: rgba(0,0,0,0.4);
            padding: 6px 15px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .balance-display img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px gold);
        }
        .balance-display span {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFD700;
        }
        .back-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .back-btn:active { background: rgba(255,215,0,0.15); }
        .back-btn::before {
            content: "←";
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-boosts">
            <div class="back-btn" onclick="window.location.href='index.html'"></div>
            <div class="balance-display">
                <img src="img/coin.png" alt="coin">
                <span id="balance">0</span>
            </div>
        </div>
        
        <div class="boosts-container">
            <div class="boost-section">
                <div class="section-title">🎁 Free boosters</div>
                <div class="free-boosters">
                    <div class="free-boost-item">
                        <div class="free-boost-title">⚡ x3 Turbo click</div>
                        <div class="free-boost-count" id="turboCount">3</div>
                        <div class="free-boost-timer" id="turboTimer">12:00:00</div>
                        <div class="use-btn" id="useTurbo">Использовать</div>
                    </div>
                    <div class="free-boost-item">
                        <div class="free-boost-title">🔋 Full energy</div>
                        <div class="free-boost-count" id="energyCount">5</div>
                        <div class="free-boost-timer" id="energyTimer">12:00:00</div>
                        <div class="use-btn" id="useEnergy">Использовать</div>
                    </div>
                </div>
            </div>
            
            <div class="boost-section">
                <div class="section-title">⚡ Multitap</div>
                <div id="multitapContainer"></div>
            </div>
            
            <div class="boost-section">
                <div class="section-title">🔋 Energy Limit</div>
                <div id="energyLimitContainer"></div>
            </div>
            
            <div class="boost-section">
                <div class="section-title">⏱️ Recharging speed</div>
                <div id="rechargeContainer"></div>
            </div>
            
            <div class="boost-section">
                <div class="section-title">🤖 Auto tap Bot</div>
                <div id="autoBotContainer"></div>
            </div>
        </div>
    </div>
    <script src="boosts.js"></script>
</body>
</html>
