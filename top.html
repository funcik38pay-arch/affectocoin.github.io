<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Top - Affecto Coin</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .top-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            margin: 5px 0 10px;
            scrollbar-width: thin;
            scrollbar-color: #FFD700 #1a1f2e;
            max-height: calc(90vh - 120px);
        }
        
        .top-container::-webkit-scrollbar {
            width: 5px;
        }
        
        .top-container::-webkit-scrollbar-track {
            background: #1a1f2e;
            border-radius: 10px;
        }
        
        .top-container::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }
        
        .top-header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            margin: 15px 15px 5px;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .balance-display {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            background: rgba(0,0,0,0.4);
            padding: 6px 15px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .balance-display img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px gold);
        }
        
        .balance-display span {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFD700;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:active {
            background: rgba(255,215,0,0.15);
        }
        
        .back-btn::before {
            content: "←";
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 15px 10px;
        }
        
        .tab {
            flex: 1;
            background: rgba(20, 25, 35, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            padding: 12px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: 0.1s;
        }
        
        .tab.active {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            color: #000;
            font-weight: 700;
            border: 1px solid white;
            box-shadow: 0 0 20px gold;
        }
        
        .top-section {
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            margin: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #FFD700;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 15px gold;
        }
        
        .top-list {
            margin-bottom: 20px;
        }
        
        .top-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        
        .top-rank {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 900;
            background: rgba(255,215,0,0.1);
            border: 2px solid;
        }
        
        .rank-1 { border-color: #FFD700; color: #FFD700; text-shadow: 0 0 10px gold; }
        .rank-2 { border-color: #C0C0C0; color: #C0C0C0; }
        .rank-3 { border-color: #CD7F32; color: #CD7F32; }
        
        .top-avatar {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: linear-gradient(145deg, #2d3b4f, #1a2535);
            border: 2px solid #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #FFD700;
            overflow: hidden;
        }
        
        .top-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .top-info {
            flex: 1;
        }
        
        .top-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }
        
        .top-score {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #FFD700;
        }
        
        .top-score img {
            width: 20px;
            height: 20px;
        }
        
        .you-section {
            background: linear-gradient(145deg, rgba(255,215,0,0.2), rgba(255,165,0,0.2));
            border: 2px solid #FFD700;
            border-radius: 25px;
            padding: 20px;
            margin: 15px;
        }
        
        .you-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <div class="back-btn" onclick="window.location.href='index.html'">Назад</div>
            <div class="balance-display">
                <img src="img/coin.png" alt="coin">
                <span id="balance">0</span>
            </div>
        </div>
        
        <div class="top-container">
            <!-- Табы -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('kings', event)">🏆 KINGS</div>
                <div class="tab" onclick="switchTab('month', event)">📅 MONTH</div>
                <div class="tab" onclick="switchTab('week', event)">⚡ WEEK</div>
            </div>
            
            <!-- TOP KINGS -->
            <div id="kings-section" class="top-section">
                <div class="section-title">🏆 TOP KINGS</div>
                <div class="top-list" id="kings-list"></div>
            </div>
            
            <!-- TOP MONTH -->
            <div id="month-section" class="top-section hidden">
                <div class="section-title">📅 TOP MONTH</div>
                <div class="top-list" id="month-list"></div>
            </div>
            
            <!-- TOP WEEK -->
            <div id="week-section" class="top-section hidden">
                <div class="section-title">⚡ TOP WEEK</div>
                <div class="top-list" id="week-list"></div>
            </div>
            
            <!-- ВАША ПОЗИЦИЯ -->
            <div class="you-section" id="you-section">
                <div class="you-title">
                    <span>👑</span> ВАША ПОЗИЦИЯ
                </div>
                <div id="you-position"></div>
            </div>
        </div>
    </div>
    <script src="top.js"></script>
</body>
</html>
