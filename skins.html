<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Skins - Affecto Coin</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .skins-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            margin: 5px 0 10px;
            scrollbar-width: thin;
            scrollbar-color: #FFD700 #1a1f2e;
            max-height: calc(90vh - 120px);
        }
        
        .skins-container::-webkit-scrollbar {
            width: 5px;
        }
        
        .skins-container::-webkit-scrollbar-track {
            background: #1a1f2e;
            border-radius: 10px;
        }
        
        .skins-container::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }
        
        .skins-header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            margin: 15px 15px 5px;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .balance-display {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            background: rgba(0,0,0,0.4);
            padding: 6px 15px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .balance-display img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px gold);
        }
        
        .balance-display span {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFD700;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:active {
            background: rgba(255,215,0,0.15);
        }
        
        .back-btn::before {
            content: "←";
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .stats-card {
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 20px;
            margin: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        
        .stat-item {
            flex: 1;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 15px gold;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 5px;
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            margin: 20px 15px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 0 15px 20px;
        }
        
        .skin-card {
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            position: relative;
        }
        
        .skin-card.owned {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
        }
        
        .skin-card.active {
            border: 3px solid #FFD700;
            box-shadow: 0 0 30px gold;
            background: rgba(40, 45, 60, 0.95);
        }
        
        .skin-card.locked {
            opacity: 0.6;
            filter: grayscale(0.5);
        }
        
        .skin-level-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,215,0,0.2);
            border: 1px solid #FFD700;
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 0.7rem;
            color: #FFD700;
        }
        
        .skin-image {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px black);
            margin: 10px 0;
        }
        
        .skin-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
        }
        
        .skin-level {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .skin-status {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 5px;
        }
        
        .status-owned {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }
        
        .status-active {
            background: rgba(255, 215, 0, 0.2);
            color: #FFD700;
            border: 1px solid #FFD700;
        }
        
        .status-locked {
            background: rgba(255, 68, 68, 0.2);
            color: #FF4444;
            border: 1px solid #FF4444;
        }
        
        .equip-btn {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            border: none;
            border-radius: 25px;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        
        .equip-btn:active {
            transform: scale(0.95);
        }
        
        .equip-btn.owned {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            grid-column: span 2;
        }
        
        .admin-panel {
            background: rgba(30, 20, 40, 0.95);
            border-radius: 30px;
            padding: 20px;
            margin: 15px;
            border: 2px solid #9932CC;
            box-shadow: 0 0 30px rgba(153,50,204,0.3);
        }
        
        .admin-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #9932CC;
            margin-bottom: 15px;
        }
        
        .admin-input {
            background: rgba(0,0,0,0.3);
            border: 1px solid #9932CC;
            border-radius: 20px;
            padding: 12px;
            color: white;
            width: 100%;
            margin-bottom: 10px;
        }
        
        .admin-btn {
            background: linear-gradient(145deg, #9932CC, #8A2BE2);
            border: none;
            border-radius: 25px;
            padding: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
        
        .hidden {
            display: none;
        }
        
        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #9932CC;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px #9932CC;
            z-index: 9999;
            border: 2px solid gold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="skins-header">
            <div class="back-btn" onclick="window.location.href='index.html'">Назад</div>
            <div class="balance-display">
                <img src="img/coin.png" alt="coin">
                <span id="balance">0</span>
            </div>
        </div>
        
        <div class="skins-container">
            <!-- Статистика -->
            <div class="stats-card">
                <div class="stat-item">
                    <div class="stat-value" id="ownedCount">0</div>
                    <div class="stat-label">Скинов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Всего</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="nextLevel">1</div>
                    <div class="stat-label">След. уровень</div>
                </div>
            </div>
            
            <!-- Скины за уровни -->
            <div class="section-title">
                <span>🎨</span> СКИНЫ ЗА УРОВНИ
            </div>
            
            <div class="skins-grid" id="levelSkinsGrid">
                <!-- Сюда будут загружаться скины -->
            </div>
            
            <!-- Админ панель (только для владельца) -->
            <div id="adminPanel" class="admin-panel hidden">
                <div class="admin-title">⚙️ АДМИН ПАНЕЛЬ</div>
                <input type="text" id="skinName" class="admin-input" placeholder="Название скина">
                <input type="number" id="skinLevel" class="admin-input" placeholder="Уровень">
                <input type="text" id="skinImage" class="admin-input" placeholder="Имя файла (например: new_skin.png)">
                <button class="admin-btn" onclick="addSkin()">➕ ДОБАВИТЬ СКИН</button>
            </div>
        </div>
    </div>
    
    <!-- Кнопка админа -->
    <div id="adminToggle" class="admin-toggle hidden" onclick="toggleAdminPanel()">⚙️</div>
    
    <script src="skins.js"></script>
</body>
</html>
