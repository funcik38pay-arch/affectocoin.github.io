<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Earn - Affecto Clicker</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .earn-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            margin: 5px 0 10px;
            scrollbar-width: thin;
            scrollbar-color: #FFD700 #1a1f2e;
            max-height: calc(90vh - 120px);
        }
        
        .earn-container::-webkit-scrollbar {
            width: 5px;
        }
        
        .earn-container::-webkit-scrollbar-track {
            background: #1a1f2e;
            border-radius: 10px;
        }
        
        .earn-container::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 10px;
        }
        
        .earn-header {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            margin: 15px 15px 5px;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .balance-display {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            background: rgba(0,0,0,0.4);
            padding: 6px 15px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        
        .balance-display img {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px gold);
        }
        
        .balance-display span {
            font-size: 1.3rem;
            font-weight: 700;
            color: #FFD700;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 40px;
            padding: 10px 20px;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-btn:active {
            background: rgba(255,215,0,0.15);
        }
        
        .back-btn::before {
            content: "←";
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #FFD700;
            margin: 20px 15px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quest-card {
            background: rgba(20, 25, 35, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 18px;
            margin: 0 15px 15px 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .quest-icon {
            width: 60px;
            height: 60px;
            background: rgba(255,215,0,0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid rgba(255,215,0,0.3);
        }
        
        .quest-info {
            flex: 1;
        }
        
        .quest-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 5px;
        }
        
        .quest-desc {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .quest-reward {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #FFD700;
        }
        
        .quest-reward img {
            width: 20px;
            height: 20px;
        }
        
        .quest-btn {
            background: linear-gradient(145deg, #FFD700, #FFA500);
            border: none;
            border-radius: 30px;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            transition: 0.1s;
            min-width: 100px;
            text-align: center;
        }
        
        .quest-btn:active {
            transform: scale(0.95);
        }
        
        .quest-btn.completed {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            pointer-events: none;
        }
        
        .quest-btn.check {
            background: linear-gradient(145deg, #2196F3, #1976D2);
            color: white;
        }
        
        .quest-btn.locked {
            background: linear-gradient(145deg, #555, #333);
            color: #888;
            pointer-events: none;
        }
        
        .progress-section {
            background: rgba(20, 25, 35, 0.9);
            border-radius: 25px;
            padding: 18px;
            margin: 0 15px 20px;
        }
        
        .progress-title {
            font-size: 1.1rem;
            color: white;
            margin-bottom: 10px;
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 10px;
            transition: width 0.3s;
        }
        
        .progress-text {
            text-align: right;
            color: #FFD700;
            font-size: 0.9rem;
        }
        
        .admin-panel {
            background: rgba(30, 20, 40, 0.95);
            border-radius: 30px;
            padding: 20px;
            margin: 15px;
            border: 2px solid #9932CC;
            box-shadow: 0 0 30px rgba(153,50,204,0.3);
            position: relative;
            z-index: 10000;
        }
        
        .admin-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #9932CC;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .admin-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .admin-input-group label {
            color: #aaa;
            font-size: 0.9rem;
        }
        
        .admin-input, .admin-select {
            background: rgba(0,0,0,0.3);
            border: 1px solid #9932CC;
            border-radius: 20px;
            padding: 12px 15px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        
        .admin-input:focus, .admin-select:focus {
            border-color: #FFD700;
        }
        
        .admin-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .admin-btn {
            flex: 1;
            min-width: 120px;
            background: linear-gradient(145deg, #9932CC, #8A2BE2);
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
        }
        
        .admin-btn:active {
            transform: scale(0.97);
        }
        
        .admin-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #9932CC;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px #9932CC;
            z-index: 9999;
            border: 2px solid gold;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="earn-header">
            <div class="back-btn" onclick="window.location.href='index.html'">Назад</div>
            <div class="balance-display">
                <img src="img/coin.png" alt="coin">
                <span id="balance">0</span>
            </div>
        </div>
        
        <div class="earn-container" id="earnContainer">
            <!-- Социальные задания -->
            <div class="section-title">
                <span>👥</span> Social Quests
            </div>
            <div id="socialQuests"></div>
            
            <!-- Бонусы за уровень -->
            <div class="section-title">
                <span>⭐</span> Level Rewards
            </div>
            <div id="levelQuests"></div>
            
            <!-- Бонусы за монеты -->
            <div class="section-title">
                <span>💰</span> Coin Milestones
            </div>
            <div id="coinQuests"></div>
            
            <!-- Реферальный прогресс -->
            <div class="progress-section">
                <div class="progress-title">👥 Приглашено друзей: <span id="referralCount">0</span>/10</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="referralProgress" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="referralReward">+5,000,000 за 10 друзей</div>
            </div>
        </div>
        
        <!-- Админ-панель -->
        <div class="admin-panel hidden" id="adminPanel">
            <div class="admin-title">⚙️ ADMIN PANEL</div>
            <div class="admin-form">
                <div class="admin-input-group">
                    <label>Тип задания</label>
                    <select class="admin-select" id="questType">
                        <option value="social">Social (TG/ссылка)</option>
                        <option value="level">Level Reward</option>
                        <option value="coin">Coin Milestone</option>
                    </select>
                </div>
                
                <div class="admin-input-group">
                    <label>Название</label>
                    <input type="text" class="admin-input" id="questName" placeholder="Вступить в TG канал">
                </div>
                
                <div class="admin-input-group">
                    <label>Описание</label>
                    <input type="text" class="admin-input" id="questDesc" placeholder="@affectocoin">
                </div>
                
                <div class="admin-input-group">
                    <label>Награда</label>
                    <input type="number" class="admin-input" id="questReward" value="200000">
                </div>
                
                <div class="admin-input-group">
                    <label>Ссылка (для social)</label>
                    <input type="text" class="admin-input" id="questLink" placeholder="https://t.me/affectocoin">
                </div>
                
                <div class="admin-input-group">
                    <label>Требование (уровень/монеты)</label>
                    <input type="number" class="admin-input" id="questRequirement" placeholder="5">
                </div>
                
                <div class="admin-buttons">
                    <button class="admin-btn" id="addQuestBtn">➕ Добавить</button>
                    <button class="admin-btn" id="exportQuestsBtn">📤 Экспорт</button>
                    <button class="admin-btn" id="importQuestsBtn">📥 Импорт</button>
                </div>
                
                <div class="admin-buttons">
                    <button class="admin-btn" id="resetQuestsBtn">🔄 Сброс</button>
                    <button class="admin-btn" id="closeAdminBtn">✕ Закрыть</button>
                </div>
            </div>
        </div>
        
        <div class="admin-toggle" id="adminToggle">⚙️</div>
    </div>
    
    <script src="earn.js"></script>
</body>
</html>
